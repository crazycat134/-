<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>面试辅助</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --sub: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --orange: #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .topbar {
            flex: 0 0 auto; padding: 10px 14px; background: var(--card);
            border-bottom: 1px solid #30363d; display: flex;
            justify-content: space-between; align-items: center;
        }
        .topbar a { color: var(--sub); text-decoration: none; font-size: 13px; }
        .status { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
        .status.on { background: rgba(63,185,80,0.15); color: var(--green); }
        .status.off { background: rgba(139,148,158,0.15); color: var(--sub); }
        .status.muted { background: rgba(210,153,34,0.15); color: var(--orange); }

        .hint-area { flex: 1; padding: 16px 14px; overflow-y: auto; }
        .hint-card {
            background: rgba(88,166,255,0.08);
            border-left: 3px solid var(--accent);
            border-radius: 6px; padding: 12px; margin-bottom: 10px;
        }
        .hint-card .q { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
        .hint-card .a { font-size: 16px; line-height: 1.5; color: var(--text); white-space: pre-wrap; font-weight: 500; }
        .placeholder { color: var(--sub); text-align: center; padding: 40px 0; font-size: 14px; }

        .bottom {
            flex: 0 0 auto; background: var(--card);
            border-top: 1px solid #30363d;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        }
        .btn-row { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 13px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn-mute { background: var(--orange); color: #fff; }
        .btn-mute.active { background: var(--red); }
        .btn-reset { background: #30363d; color: var(--text); flex: 0 0 80px; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/">← 题目识别</a>
        <span style="font-size:15px;font-weight:600">🎤 面试辅助</span>
        <span id="recStatus" class="status on">监听中</span>
    </div>

    <div id="hintArea" class="hint-area">
        <div class="placeholder">电脑正在捕获系统声音<br>面试官说话后自动出提示</div>
    </div>

    <div class="bottom">
        <div class="btn-row">
            <button id="btnMute" class="btn btn-mute">🔇 我要说话（暂停监听）</button>
            <button id="btnReset" class="btn btn-reset">重置</button>
        </div>
    </div>

    <script>
    const token = new URLSearchParams(location.search).get('token');
    const btnMute = document.getElementById('btnMute');
    const btnReset = document.getElementById('btnReset');
    const recStatus = document.getElementById('recStatus');
    const hintArea = document.getElementById('hintArea');
    let lastHint = '';

    async function poll() {
        try {
            const res = await fetch('/api/v1/interview/latest' + location.search, {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            const data = await res.json();
            if (data.hint && data.hint !== lastHint) {
                lastHint = data.hint;
                const card = document.createElement('div');
                card.className = 'hint-card';
                card.innerHTML = `<div class="q">💬 ${escapeHtml(data.transcribed || '')}</div><div class="a">${escapeHtml(data.hint)}</div>`;
                hintArea.appendChild(card);
                hintArea.scrollTop = hintArea.scrollHeight;
            }
        } catch (e) {}
        setTimeout(poll, 2000);
    }
    poll();

    btnMute.addEventListener('click', async () => {
        const res = await fetch('/api/v1/interview/mute' + location.search, {
            method: 'POST',
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        const data = await res.json();
        if (data.muted) {
            btnMute.textContent = '🔴 继续监听';
            btnMute.classList.add('active');
            recStatus.textContent = '已暂停（你在说话）';
            recStatus.className = 'status muted';
        } else {
            btnMute.textContent = '🔇 我要说话（暂停监听）';
            btnMute.classList.remove('active');
            recStatus.textContent = '监听中';
            recStatus.className = 'status on';
        }
    });

    btnReset.addEventListener('click', async () => {
        await fetch('/api/v1/interview/reset' + location.search, {
            method: 'POST',
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        hintArea.innerHTML = '<div class="placeholder">已重置对话历史</div>';
        lastHint = '';
    });

    function escapeHtml(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    </script>
</body>
</html>
