<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面试辅助</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --text: #e6edf3; --sub: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149; --orange: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* Top bar */
.topbar {
  flex: 0 0 auto; padding: 10px 14px; background: var(--card);
  border-bottom: 1px solid #30363d; display: flex;
  justify-content: space-between; align-items: center;
}
.topbar a { color: var(--sub); text-decoration: none; font-size: 13px; }
.status { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
.status.on { background: rgba(63,185,80,0.15); color: var(--green); }
.status.muted { background: rgba(210,153,34,0.15); color: var(--orange); }

/* Volume bar */
.vol-bar-wrap {
  flex: 0 0 auto; height: 4px; background: #21262d; position: relative;
}
.vol-bar {
  height: 100%; width: 0%; background: var(--green);
  transition: width 0.15s ease; border-radius: 0 2px 2px 0;
}

/* Status indicator */
.status-line {
  flex: 0 0 auto; padding: 8px 14px; text-align: center;
  font-size: 13px; color: var(--sub); min-height: 32px;
}
.status-line.active { color: var(--accent); }
.status-line.thinking { color: var(--orange); }

/* Hint area */
.hint-area { flex: 1; padding: 8px 14px; overflow-y: auto; }
.transcript {
  font-size: 14px; color: var(--sub); padding: 10px 12px;
  background: rgba(139,148,158,0.08); border-radius: 8px; margin-bottom: 10px;
  line-height: 1.5;
}
.hint-card {
  background: rgba(88,166,255,0.1);
  border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 14px; margin-bottom: 12px;
}
.hint-card .q { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
.hint-card .a {
  font-size: 16px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap; font-weight: 500;
}
.placeholder { color: var(--sub); text-align: center; padding: 40px 0; font-size: 14px; line-height: 1.8; }

/* Bottom */
.bottom {
  flex: 0 0 auto; background: var(--card);
  border-top: 1px solid #30363d;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
}
.btn-row { display: flex; gap: 8px; }
.btn {
  flex: 1; padding: 14px; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn-mute { background: var(--orange); color: #fff; }
.btn-mute.active { background: var(--red); }
.btn-reset { background: #30363d; color: var(--text); flex: 0 0 80px; font-size: 14px; }

/* Pulse animation */
@keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.5} }
.pulsing { animation: pulse 1s infinite; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← 题目识别</a>
  <span style="font-size:15px;font-weight:600">🎤 面试辅助</span>
  <span id="recStatus" class="status on">🟢 监听中</span>
</div>

<div class="vol-bar-wrap"><div id="volBar" class="vol-bar"></div></div>

<div id="statusLine" class="status-line">🎙️ 等待面试官发言...</div>

<div id="subtitleBar" style="padding:0 14px 8px; font-size:18px; line-height:1.5; color:var(--text); min-height:44px;">
</div>

<div id="hintArea" class="hint-area">

<div class="bottom">
  <div class="btn-row">
    <button id="btnMute" class="btn btn-mute">🔇 我要说话（暂停监听）</button>
    <button id="btnReset" class="btn btn-reset">重置</button>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
const btnMute = document.getElementById('btnMute');
const btnReset = document.getElementById('btnReset');
const recStatus = document.getElementById('recStatus');
const hintArea = document.getElementById('hintArea');
const statusLine = document.getElementById('statusLine');
const volBar = document.getElementById('volBar');
let lastHint = '';
let lastTranscribed = '';

async function poll() {
  try {
    const res = await fetch('/api/v1/interview/latest' + location.search, {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    const data = await res.json();

    // Volume bar: 0-32767 → 0-100%
    const v = data.volume || 0;
    volBar.style.width = Math.min(100, v / 327.67) + '%';
    if (v > 800) volBar.style.background = 'var(--green)';
    else volBar.style.background = 'var(--sub)';

    // Status line
    if (data.status && data.status.startsWith('streaming')) {
      statusLine.textContent = '✨ AI 正在生成提示...';
      statusLine.className = 'status-line thinking pulsing';
    } else if (v > 800) {
      statusLine.textContent = '🔊 检测到声音，正在转写...';
      statusLine.className = 'status-line active pulsing';
    } else {
      statusLine.textContent = '🎙️ 等待面试官发言...';
      statusLine.className = 'status-line';
    }

    // Subtitle: show latest transcribed text (any language)
    const sub = document.getElementById('subtitleBar');
    if (data.transcribed && data.transcribed !== sub.textContent) {
      sub.textContent = '💬 ' + data.transcribed;
    }

    // New hint card
    if (data.hint && data.hint !== lastHint) {
      // Remove placeholder on first hint
      const ph = hintArea.querySelector('.placeholder');
      if (ph) ph.remove();

      lastHint = data.hint;
      // Update existing card if transcribed matches, else new card
      const card = document.createElement('div');
      card.className = 'hint-card';
      card.innerHTML = '<div class="q">💬 ' + esc(data.transcribed || '') + '</div><div class="a">' + esc(data.hint) + '</div>';
      hintArea.appendChild(card);
      hintArea.scrollTop = hintArea.scrollHeight;
    }
  } catch (e) {}
  setTimeout(poll, 800);
}
poll();

btnMute.addEventListener('click', async () => {
  const res = await fetch('/api/v1/interview/mute' + location.search, {
    method: 'POST',
    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
  });
  const data = await res.json();
  if (data.muted) {
    btnMute.textContent = '🔴 继续监听';
    btnMute.classList.add('active');
    recStatus.textContent = '🟡 已暂停（你在说话）';
    recStatus.className = 'status muted';
  } else {
    btnMute.textContent = '🔇 我要说话（暂停监听）';
    btnMute.classList.remove('active');
    recStatus.textContent = '🟢 监听中';
    recStatus.className = 'status on';
  }
});

btnReset.addEventListener('click', async () => {
  await fetch('/api/v1/interview/reset' + location.search, {
    method: 'POST',
    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
  });
  hintArea.innerHTML = '<div class="placeholder">已重置<br>等待下一个问题...</div>';
  lastHint = '';
});

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
