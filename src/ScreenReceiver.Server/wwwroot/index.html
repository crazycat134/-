<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 面试助手</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e8e8e8;
            --sub: #999;
            --accent: #4caf50;
            --accent2: #2196f3;
            --danger: #d32f2f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .topbar {
            flex: 0 0 auto;
            padding: 10px 14px;
            background: var(--card);
            border-bottom: 1px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 15px; font-weight: 600; }
        .conn { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
        .conn.ok { background: rgba(76,175,80,0.15); color: var(--accent); }
        .conn.wait { background: rgba(255,193,7,0.15); color: #ffc107; }
        .conn.err { background: rgba(211,47,47,0.15); color: var(--danger); }

        .ai-section {
            flex: 0 0 auto;
            background: var(--card);
            border-bottom: 1px solid #2c2c2c;
            max-height: 38vh;
            overflow-y: auto;
            padding: 12px 14px;
        }
        .ai-title { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
        .ai-content { font-size: 14px; line-height: 1.6; color: var(--text); }
        .ai-content .placeholder { color: var(--sub); text-align: center; padding: 16px 0; }
        .ai-content .err { color: var(--danger); }
        .ai-content b { color: #fff; }
        .md-h1 { font-size: 15px; font-weight: 700; margin: 8px 0 4px; color: #fff; }
        .md-h2 { font-size: 14px; font-weight: 700; margin: 6px 0 3px; color: #fff; }
        .md-li { margin-left: 6px; }

        .video-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            min-height: 0;
            position: relative;
        }
        #frame { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        .frame-tag {
            position: absolute; top: 8px; right: 8px;
            font-size: 11px; color: var(--sub);
            background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px;
        }

        .control-section {
            flex: 0 0 auto;
            background: var(--card);
            border-top: 1px solid #2c2c2c;
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        }
        .mode-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .mode-btn {
            flex: 1; padding: 7px; border: 1px solid #333;
            background: #2a2a2a; color: var(--text);
            border-radius: 7px; font-size: 13px; cursor: pointer;
        }
        .mode-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
        .auto-panel { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--sub); }
        .auto-panel select {
            flex: 1; padding: 5px; background: #2a2a2a; color: var(--text);
            border: 1px solid #333; border-radius: 5px; font-size: 13px;
        }
        .btn-row { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:disabled { background: #3a7a3c; }
        .btn-secondary { background: #333; color: var(--text); }
        .btn-danger { background: var(--danger); color: #fff; }
        .analyze-status { text-align: center; font-size: 12px; color: var(--sub); margin-top: 6px; min-height: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">AI 面试助手</div>
        <div id="connStatus" class="conn err">连接中…</div>
    </div>

    <div class="ai-section">
        <div class="ai-title">🧠 AI 解析</div>
        <div id="aiAnswer" class="ai-content">
            <div class="placeholder">点底部"识别这道题"按钮开始</div>
        </div>
    </div>

    <div class="video-section">
        <img id="frame" alt="screen" />
        <div id="frameTag" class="frame-tag"></div>
    </div>

    <div class="control-section">
        <div class="mode-row">
            <button id="modeManual" class="mode-btn active">手动识别</button>
            <button id="modeAuto" class="mode-btn">自动识别</button>
        </div>
        <div id="autoPanel" class="auto-panel hidden">
            <span>间隔</span>
            <select id="intervalSelect">
                <option value="5">5 秒</option>
                <option value="10" selected>10 秒</option>
                <option value="15">15 秒</option>
                <option value="30">30 秒</option>
            </select>
        </div>
        <div class="btn-row">
            <button id="analyzeBtn" class="btn btn-primary">📷 识别这道题</button>
            <button id="autoToggleBtn" class="btn btn-secondary hidden">开始自动</button>
        </div>
        <div id="analyzeStatus" class="analyze-status"></div>
    </div>

    <script>
    const token = new URLSearchParams(location.search).get('token');
    const frameImg = document.getElementById('frame');
    const frameTag = document.getElementById('frameTag');
    const connStatus = document.getElementById('connStatus');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const autoToggleBtn = document.getElementById('autoToggleBtn');
    const modeManualBtn = document.getElementById('modeManual');
    const modeAutoBtn = document.getElementById('modeAuto');
    const autoPanel = document.getElementById('autoPanel');
    const intervalSelect = document.getElementById('intervalSelect');
    const analyzeStatus = document.getElementById('analyzeStatus');
    const aiAnswer = document.getElementById('aiAnswer');

    let framePolling = false, autoTimer = null, autoRunning = false, analyzing = false;
    if (!token) { connStatus.textContent = '未授权'; connStatus.className = 'conn err'; }

    async function pollFrame() {
        if (framePolling) return;
        framePolling = true;
        try {
            const res = await fetch('/api/v1/frames/latest', {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            if (res.ok) {
                frameImg.src = URL.createObjectURL(await res.blob());
                connStatus.textContent = '● 已连接';
                connStatus.className = 'conn ok';
                const fid = res.headers.get('X-Frame-Id');
                if (fid) frameTag.textContent = 'Frame #' + fid;
            } else if (res.status === 404) {
                connStatus.textContent = '等待画面…';
                connStatus.className = 'conn wait';
            } else if (res.status === 401) {
                connStatus.textContent = '未授权';
                connStatus.className = 'conn err';
            }
        } catch (e) {
            connStatus.textContent = '连接断开';
            connStatus.className = 'conn err';
        } finally { framePolling = false; setTimeout(pollFrame, 1000); }
    }
    pollFrame();

    modeManualBtn.addEventListener('click', () => setMode('manual'));
    modeAutoBtn.addEventListener('click', () => setMode('auto'));
    function setMode(m) {
        if (m === 'manual') {
            modeManualBtn.classList.add('active'); modeAutoBtn.classList.remove('active');
            autoPanel.classList.add('hidden');
            analyzeBtn.classList.remove('hidden'); autoToggleBtn.classList.add('hidden');
            stopAuto();
        } else {
            modeAutoBtn.classList.add('active'); modeManualBtn.classList.remove('active');
            autoPanel.classList.remove('hidden');
            analyzeBtn.classList.add('hidden'); autoToggleBtn.classList.remove('hidden');
        }
    }

    analyzeBtn.addEventListener('click', () => runAnalysis('识别中…'));
    autoToggleBtn.addEventListener('click', () => autoRunning ? stopAuto() : startAuto());
    function startAuto() {
        const ms = parseInt(intervalSelect.value) * 1000;
        autoRunning = true;
        autoToggleBtn.textContent = '停止自动';
        autoToggleBtn.classList.remove('btn-secondary'); autoToggleBtn.classList.add('btn-danger');
        runAnalysis('自动识别中…');
        autoTimer = setInterval(() => runAnalysis('自动识别中…'), ms);
    }
    function stopAuto() {
        autoRunning = false;
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        autoToggleBtn.textContent = '开始自动';
        autoToggleBtn.classList.add('btn-secondary'); autoToggleBtn.classList.remove('btn-danger');
    }

    let requestSeq = 0;
    async function runAnalysis(statusText) {
        if (!token) { analyzeStatus.textContent = '未授权'; return; }
        if (analyzing) { analyzeStatus.textContent = '上次还在识别中…'; return; }
        const seq = ++requestSeq;
        analyzing = true;
        analyzeStatus.textContent = statusText;
        analyzeBtn.disabled = true;
        try {
            const res = await fetch('/api/v1/analyze', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                signal: AbortSignal.timeout(35000)
            });
            const data = await res.json();
            if (seq !== requestSeq) return; // old response, discard
            if (res.ok) {
                aiAnswer.innerHTML = renderMarkdown(data.answer || '(无结果)');
                analyzeStatus.textContent = '✅ 识别完成';
            } else {
                aiAnswer.innerHTML = '<div class="placeholder err">❌ ' + (data?.error?.message || '识别失败') + '</div>';
                analyzeStatus.textContent = '识别失败';
            }
        } catch (e) {
            if (seq === requestSeq) analyzeStatus.textContent = '错误: ' + e.message;
        } finally { if (seq === requestSeq) { analyzing = false; analyzeBtn.disabled = false; } }
    }

    function renderMarkdown(text) {
        return text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
            .replace(/^### (.+)$/gm, '<div class="md-h2">$1</div>')
            .replace(/^## (.+)$/gm, '<div class="md-h1">$1</div>')
            .replace(/^# (.+)$/gm, '<div class="md-h1">$1</div>')
            .replace(/^- (.+)$/gm, '<div class="md-li">• $1</div>')
            .replace(/\n/g, '<br>');
    }
    </script>
</body>
</html>
